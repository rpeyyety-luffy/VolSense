<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VolSense</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Person 1: Week 3. This page only DISPLAYS prediction.json made by Python. -->
  <header>
    <h1>VolSense</h1>
    <p>Know if the market will be calm or stormy, before it happens.</p>
  </header>

  <main>
    <section class="cards">
      <div class="card"><span class="label">India VIX</span><span id="vix" class="value">–</span></div>
      <div class="card"><span class="label">Next 5 days</span><span id="direction" class="value">–</span></div>
      <div class="card"><span class="label">Confidence</span><span id="confidence" class="value">–</span></div>
      <div class="card"><span class="label">Model accuracy</span><span id="accuracy" class="value">–</span></div>
    </section>

    <section class="summary">
      <h2>What this means</h2>
      <p id="summary">Loading…</p>
      <p class="date">Updated: <span id="date">–</span></p>
    </section>

    <!-- TODO(Person 1): VIX history chart with Chart.js -->
    <!-- TODO(Person 1): put the Streamlit app link here -->
    <a class="button" href="#">Ask the AI →</a>
  </main>

  <footer>Risk-awareness tool, not financial advice.</footer>
  <script src="script.js"></script>
</body>
</html>
